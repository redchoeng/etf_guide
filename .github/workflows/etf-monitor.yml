name: ETF Monitor & Report

on:
  schedule:
    # 한국장 시간 30분 간격 (KST 09:05~15:35 = UTC 00:05~06:35) 월~금
    # 정각(:00/:30)은 GitHub 크론 혼잡으로 스킵이 잦아서 5분 오프셋
    # 장중 낙폭 구간 진입 시 바로 알림 — 같은 구간은 하루 1번만 (날짜 dedup)
    - cron: '5,35 0-6 * * 1-5'

  workflow_dispatch:  # 수동 실행 가능

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env

      - name: Run price check & Telegram alerts
        # 매일 아침 요약(--digest, 날짜 dedup으로 하루 1건) + 장중 긴급 알림
        run: python run_monitor.py --once --digest

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add index.html alerts/state.json alerts/holdings_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "ETF report update - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
