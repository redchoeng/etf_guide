name: ETF Monitor & Report

on:
  schedule:
    # 장전 브리핑 (KST 08:30 = UTC 23:30, 일~목) — 구성종목 매매내역 + 추정 iNAV
    # 개장 전이라 KRX 트래픽이 적어 가장 안정적으로 당일 공시를 잡는 시간대
    - cron: '30 23 * * 0-4'

    # 한국장 시간 30분 간격 (KST 09:05~15:35 = UTC 00:05~06:35) 월~금
    # 정각(:00/:30)은 GitHub 크론 혼잡으로 스킵이 잦아서 5분 오프셋
    # 장중 낙폭 구간 진입 시 바로 알림 — 같은 구간은 하루 1번만 (날짜 dedup)
    - cron: '5,35 0-6 * * 1-5'

    # 미국장 마감 직후 (KST 05:10 = UTC 20:10) — 리포트 예상가 갱신 (알림 없음)
    - cron: '10 20 * * 1-5'

  workflow_dispatch:  # 수동 실행 가능

  push:
    paths:
      - '.trigger'    # 클라우드 routine이 이 파일을 갱신·push하면 실행 (API 폴백 경로)

# 같은 시각에 여러 트리거(cron-job.org + 로컬 스케줄러)가 겹쳐도
# 순차 실행 — 뒤 실행은 앞 실행이 push한 state.json을 보고 중복 발송 스킵
concurrency:
  group: etf-monitor
  cancel-in-progress: false

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env

      - name: Debug KRX raw response (임시)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python debug_krx2.py || true

      - name: Run price check & Telegram alerts
        # UTC 23시(KST 08:30, 장전) = 구성종목+iNAV 브리핑
        # UTC 19~22시(미국장 마감 직후) = 리포트 예상가 갱신만, 알림 없음
        # 그 외(한국장 시간) = 가격 체크 + 긴급/요약 알림
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "23" ]; then
            python run_monitor.py --premarket
          elif [ "$HOUR" -ge 19 ]; then
            echo "미국장 마감 — 리포트 갱신만 (알림 스킵)"
          else
            python run_monitor.py --once --digest
          fi

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add index.html alerts/state.json alerts/holdings_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "ETF report update - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
