name: ETF Monitor & Report

on:
  schedule:
    # 한국 장 시초가 (KST 09:00 = UTC 00:00) 월~금
    - cron: '0 0 * * 1-5'

  workflow_dispatch:  # 수동 실행 가능

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env

      - name: Run price check & Telegram alerts
        run: python run_monitor.py --once --force --digest

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add etf_report_*.html index.html alerts/state.json
          if ! git diff --staged --quiet; then
            git commit -m "ETF report update - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
