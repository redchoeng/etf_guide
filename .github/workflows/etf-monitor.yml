name: ETF Monitor & Report

on:
  schedule:
    # 한국장 시간 30분 간격 (KST 09:00~15:30 = UTC 00:00~06:30) 월~금
    # 장중 낙폭 구간 진입 시 바로 알림 — 같은 구간은 하루 1번만 (날짜 dedup)
    - cron: '*/30 0-6 * * 1-5'

  workflow_dispatch:  # 수동 실행 가능

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env

      - name: Run price check & Telegram alerts
        run: |
          # 월요일(KST) 또는 수동 실행 → 주간 매수 가이드(--digest)
          # 화~금 → 긴급(급락/낙폭 구간 진입) 알림만
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run_monitor.py --once --digest
          else
            python run_monitor.py --once
          fi

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add index.html alerts/state.json
          if ! git diff --staged --quiet; then
            git commit -m "ETF report update - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
